#//.github/workflows/express.yml

name: Build and Deploy

on:
  push:
    branches: [ main, development ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: 📦 Install Node dependencies
      run: npm install
      
    - name: 🦀 Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: wasm32-unknown-unknown
    
    - name: ♻ Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: 📦 Install Rust tools
      run: |
        cargo install wasm-pack minix
        sudo apt-get update
        sudo apt-get install -y brotli gzip
      
    - name: 🔨 Build
      run: |
        chmod +x ./build
        ./build
      
    - name: 📦 Prepare for deployment
      run: |
        mkdir -p deploy
        cp -r static deploy/
        cp index.html deploy/
        cp -r pkg deploy/
        ls -la deploy/  # debug: mostra o que foi copiado
      
    - name: 🚀 Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.DEPLOY_TOKEN }}
        publish_dir: ./deploy
        force_orphan: true
