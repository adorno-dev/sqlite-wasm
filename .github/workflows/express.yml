#//.github/workflows/express.yml

name: Build Express Server

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'  # Cacheia node_modules
    
    # 🔥 NOVO PASSO: Instala dependências
    - name: 📦 Install Node dependencies
      run: npm install
      
    - name: 🦀 Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: wasm32-unknown-unknown
    
    - name: ♻️ Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: 📦 Install Rust tools
      run: |
        cargo install wasm-pack minix
        sudo apt-get update
        sudo apt-get install -y brotli gzip
      
    - name: 🔨 Build (release)
      run: |
        chmod +x ./build
        ./build
      
    - name: 🚀 Start server
      run: |
        NODE_ENV=production node webserver.js &
        sleep 5
      
    - name: ✅ Test server
      run: curl -f http://localhost:8080 || exit 1
      
    - name: 📦 Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wasm-package
        path: pkg/

    - name: 📦 Build for GitHub Pages
      run: |
        # Cria pasta para deploy
        mkdir -p deploy
        # Copia tudo que precisa
        cp -r static deploy/
        cp index.html deploy/
        cp -r pkg deploy/
        # Garante permissões
        chmod -R 755 deploy/
    
    - name: 🚀 Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
