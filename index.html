<body bgcolor="#000000" fgcolor="#ffffff">

<script type="module">
    // Trunk vai resolver esse caminho automaticamente
    import init, * as wasm from "./pkg/sqlite_wasm.js";
    
    window.wasm = wasm;
    
    // Inicialização
    await init();
    await wasm.initialize_worker("/sqlite-wasm/sqlite3-worker1.js");
    
    console.log("✅ WASM loaded!");
</script>
