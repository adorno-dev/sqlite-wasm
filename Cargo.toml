[package]
name = "sqlite-wasm"
description = "A high-performance SQLite wrapper for WebAssembly with OPFS support"
version = "0.1.2"
edition = "2024"
authors = ["adorno-dev <adorno.dev@gmail.com>"]
repository = "https://github.com/adorno-dev/sqlite-wasm"
license = "MIT"
readme = "README.md"
keywords = ["sqlite-wasm", "sqlite", "opfs", "database", "worker"]
categories = ["wasm", "database"]
exclude = ["/pkg", "/target"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uuid = { version = "1.0", features = ["v4", "js"] }
futures-channel = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Worker", 
    "MessageEvent", 
    "Window",
    "Navigator",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "WorkerOptions",
    "WorkerType",
    "console"
]}
console_error_panic_hook = "0.1.7"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"           # Optimize for size
lto = true                # Link time optimization for better performance
codegen-units = 1         # Compile everything together for maximum optimization
panic = "abort"           # Remove unwinding for smaller binary
strip = "debuginfo"       # Remove debug symbols (keeps necessary symbols for wasm-bindgen)

[profile.dev]
opt-level = 0              # Fast compilation for development
lto = false                # Disable LTO for faster builds
codegen-units = 16         # Parallel compilation for speed

[package.metadata.docs.rs]
features = ["docs"]  # enable this feature when generating docs
rustdoc-args = ["--cfg", "docsrs"]  # marks items as unstable/nightly on docs.rs
targets = ["wasm32-unknown-unknown"]  # focus on WASM target for documentation
