[package]
# Package name - used as the crate name on crates.io
name = "sqlite-wasm"
# Brief description of what this crate does
description = "A high-performance SQLite wrapper for WebAssembly with OPFS support"
# Semantic version following semver rules
version = "0.1.4"
# Rust edition (2024 is the latest, determines available features)
edition = "2024"
# Author information in "Name <email>" format
authors = ["adorno-dev <adorno.dev@gmail.com>"]
# URL to the source repository
repository = "https://github.com/adorno-dev/sqlite-wasm"
# License identifier (MIT is permissive open source)
license = "MIT"
# Path to the README file displayed on crates.io
readme = "README.md"
# Keywords for crates.io search optimization
keywords = ["sqlite-wasm", "sqlite", "opfs", "database", "worker"]
# Categories for crates.io organization
categories = ["wasm", "database"]
# Files/directories to exclude when publishing to crates.io
exclude = ["/pkg", "/target"]

[lib]
# cdylib generates a C-compatible dynamic library for JavaScript interop
# rlib generates a Rust library for linking with other Rust crates
crate-type = ["cdylib", "rlib"]

[dependencies]
# UUID generation with v4 (random) and JS interoperability features
uuid = { version = "1.0", features = ["v4", "js"] }
# Simple channels for async communication (used for oneshot channels)
futures-channel = "0.3"
# Bindings to JavaScript standard built-in objects
js-sys = "0.3"
# Core wasm-bindgen library for Rust/JS interoperability
wasm-bindgen = "0.2"
# Utilities for working with JavaScript Promises in async Rust
wasm-bindgen-futures = "0.4"
# Bindings to Web APIs (browser-specific features)
web-sys = { version = "0.3", features = [
    "Worker",                    # Web Worker API for background threads
    "MessageEvent",              # Event type for worker communication
    "Window",                    # Global window object
    "Navigator",                  # Browser navigator API for user agent detection
    "Storage",
    "StorageManager",             # Local storage API
    "FileSystemHandle",           # File system API for accessing files
    "Blob",                       # Binary large object API for embedded files
    "BlobPropertyBag",            # Configuration for Blob creation
    "Url",                        # URL API for creating object URLs
    "WorkerOptions",              # Configuration options for Worker
    "WorkerType",                 # Worker type (classic vs module)
    "FileReader",                 # File reading API (used as fallback)
    "Performance",                # High-resolution timing for metrics
    "console",                    # Browser console for logging
]}
# Better panic messages when running in browser
console_error_panic_hook = "0.1.7"
# Base64 encoding/decoding for data URLs fallback
base64 = "0.22.1"
# Futures utilities (re-exported from futures-rs)
futures = "0.3.32"
# JSON serialization/deserialization
serde_json = "1.0.149"
# Lazy initialization of static variables (used for caches)
lazy_static = "1.5.0"
# Async runtime (used for Mutex in pool implementation)
tokio = { version = "1.50.0", features = ["sync"] }

[dev-dependencies]
# Testing framework for wasm-bindgen (runs tests in browser/Node.js)
wasm-bindgen-test = "0.3"
# Futures utilities for async test helpers
futures = "0.3.32"
# JS bindings needed in test utilities
js-sys = "0.3"
# Core wasm-bindgen functionality for tests
wasm-bindgen = "0.2"
# Promise utilities for async test helpers
wasm-bindgen-futures = "0.4"

# Core module tests - covers worker, database, bindings, and blobs
[[test]]
# Test suite name (used with --test flag)
name = "core"
# Entry point file (must exist at this path)
path = "tests/core.rs"
# Disable default test harness to use wasm-bindgen-test's harness
harness = false

# Extensions module tests - covers batch, pool, prepared, and queries
[[test]]
name = "extensions"
path = "tests/extensions.rs"
harness = false

# Integration tests - covers complete end-to-end workflows
[[test]]
name = "integration"
path = "tests/integration.rs"
harness = false

# # Production release profile (commented out alternative configuration)
# opt-level = "z"           # Optimize aggressively for binary size
# lto = true                # Enable Link Time Optimization across crates
# codegen-units = 1         # Single compilation unit for max optimization
# panic = "abort"           # Abort on panic instead of unwinding (smaller binary)
# strip = "debuginfo"       # Remove debug symbols (keeps necessary for wasm-bindgen)

[profile.release]
# Optimization level "z" focuses on binary size (similar to -Os)
opt-level = "z"
# Link Time Optimization - optimizes across crate boundaries
lto = true
# Single code generation unit for maximum optimization (slower compilation)
codegen-units = 1
# Abort on panic instead of unwinding (reduces binary size)
panic = "abort"
# Strip debug symbols from final binary (smaller but harder to debug)
strip = "debuginfo"
# Disable incremental compilation for release builds (clean builds are better)
incremental = false

[profile.dev]
# No optimizations for fastest compilation during development
opt-level = 0
# Disable LTO for faster builds
lto = false
# Many parallel codegen units for fast compilation
codegen-units = 16

[profile.test]
# No optimizations for faster test compilation
opt-level = 0
# Disable LTO for faster test builds
lto = false
# Parallel compilation for speed
codegen-units = 16
# Use unwind panics for better stack traces when tests fail
# panic = "unwind"
# Keep all debug symbols for easier debugging of test failures
strip = "none"

[package.metadata.docs.rs]
# Features to enable when generating documentation on docs.rs
features = ["docs"]
# Rustdoc arguments: marks items with #[cfg(docsrs)] as unstable/nightly
rustdoc-args = ["--cfg", "docsrs"]
# Focus on WASM target for documentation (avoid generating non-WASM docs)
targets = ["wasm32-unknown-unknown"]

[build-dependencies]
# JavaScript/CSS minifier for optimizing embedded assets
minifier = "0.3"
# Brotli compression for embedded asset optimization
brotli = "8.0"
# Gzip compression (flate2) for embedded asset optimization
flate2 = "1.0"
# Error handling for build script
anyhow = "1.0"
