[package]
name = "sqlite-wasm"
description = "A simgle wasm to work with sqlite-wasm (official)"
version = "0.1.0"
edition = "2024"
authors = ["adorno-dev <adorno.dev@gmail.com>"]
repository = "https://github.com/adorno-dev/sqlite-wasm"
# license = "MIT"
# readme = "README.md"
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uuid = { version = "1.0", features = ["v4", "js"] }
futures-channel = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Worker", 
    "MessageEvent", 
    "Window",
    "console"
]}

[profile.release]
opt-level = "z"           # Otimizar tamanho
lto = true                # Link time optimization
codegen-units = 1         # Máxima otimização
panic = "abort"           # Remove unwinding
