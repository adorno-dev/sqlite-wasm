[build]
target = "index.html"
dist = "dist"
cargo = false
release = true
filehash = false
no_sri = true
# public-url = "/"

[serve]
addresses = ["0.0.0.0"]
port = 8080
open = false
disable_sri = true

[watch]
watch = []
ignore = []

[serve.headers]
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "require-corp"
